apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshcheriakov-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: meshcheriakov-app

  template:
    metadata:
      labels:
        app: meshcheriakov-app

    spec:
      containers:
        - name: fastapi
          image: meshcheriakov-assistant:lab5
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: meshcheriakov-app-config

            - secretRef:
                name: meshcheriakov-app-secret