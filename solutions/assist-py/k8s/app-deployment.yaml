
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshcheriakov-app

spec:
  replicas: 4

  selector:
    matchLabels:
      app: meshcheriakov-app

  template:
    metadata:
      labels:
        app: meshcheriakov-app

    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: meshcheriakov-app

      containers:
        - name: fastapi
          image: ghcr.io/kellylamb123/konteyner:sha-3847369
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: meshcheriakov-app-config
            - secretRef:
                name: meshcheriakov-app-secret

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
