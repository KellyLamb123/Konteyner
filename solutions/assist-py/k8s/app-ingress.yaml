
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meshcheriakov-app-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: meshcheriakov.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meshcheriakov-app
                port:
                  number: 8000
