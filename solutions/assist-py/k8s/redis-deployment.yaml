apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshcheriakov-redis

spec:
  replicas: 1

  selector:
    matchLabels:
      app: meshcheriakov-redis

  template:
    metadata:
      labels:
        app: meshcheriakov-redis

    spec:
      containers:
        - name: redis
          image: redis:7-alpine

          ports:
            - containerPort: 6379

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5